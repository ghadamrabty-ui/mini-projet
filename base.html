
{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EduResources{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'ressources/style.css' %}?v=3">
</head>
<body>

<header class="navbar">
    <a href="{% url 'accueil' %}" class="logo">
        <span class="logo-icon">E</span>
        EduResources
    </a>

    <nav>
        <a href="{% url 'accueil' %}">Accueil</a>
        <a href="{% url 'liste_ressources' %}">Ressources</a>
        <a href="{% url 'liste_categories' %}">Catégories</a>
        <a href="{% url 'ajouter_ressource' %}">Ajouter</a>
    </nav>
</header>

<main class="container">

    {% if messages %}
        {% for message in messages %}
            <div class="alert success">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}

</main>

<footer>
    <p>© 2026 EduResources - Gestion des ressources pédagogiques</p>
</footer>

</body>
</html>
