
{% extends 'ressources/base.html' %}

{% block title %}{{ titre }} - EduResources{% endblock %}

{% block content %}

<div class="form-card">

    <span class="tag">GESTION DES RESSOURCES</span>

    <h1>{{ titre }}</h1>

    <p>Remplissez les informations de la ressource.</p>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <div class="actions">

            <button type="submit" class="btn btn-primary">
                Enregistrer
            </button>

            <a href="{% url 'liste_ressources' %}"
               class="btn btn-secondary">
                Annuler
            </a>

        </div>

    </form>

</div>

{% endblock %}
